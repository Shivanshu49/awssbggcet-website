name: Release SCD seats

# Manual fallback only ("Run workflow"): Vercel Cron runs the release job every 10 minutes (vercel.json).
# GitHub's schedule ran 6-9 hours late. Releases unpaid seats past registration.holdHours and sends the
# 20-minute reminder; see docs/scd-registration-plan.md section 7. Does nothing until CRON_SECRET is set.
on:
  workflow_dispatch:

permissions: {}

jobs:
  release-seats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the release job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://www.awssbggcet.com
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET isn't set, so the release job was skipped."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/release-seats"
